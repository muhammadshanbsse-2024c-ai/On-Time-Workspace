spring.application.name=demo

# =========================================================
# FR-10 FIX: File & Request Size Limits (For Attachments/Base64/AI)
# =========================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.max-http-header-size=2MB

# =========================================================
# Database Setup (Local H2 by default, Supabase PostgreSQL on Live)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/boarddb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.h2.console.enabled=true

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================================================
# JWT Configuration
# =========================================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# =========================================================
# Standard Spring Security Google OAuth2 Configuration
# =========================================================
spring.security.oauth2.client.registration.google.client-id=776895967223-r4n5juiof3ovsi60adgob63da755vl72.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Custom Google Client ID
google.client.id=776895967223-r4n5juiof3ovsi60adgob63da755vl72.apps.googleusercontent.com

# =========================================================
# JavaMailSender / SMTP Configuration (Real Email OTP)
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:imshan314@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# =========================================================

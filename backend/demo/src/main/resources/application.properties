spring.application.name=demo

# =========================================================
# Frontend Live URL (Vercel URL via Render Env Variable)
# =========================================================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# =========================================================
# Reverse Proxy / Render HTTPS Support (CRITICAL for OAuth)
# =========================================================
server.forward-headers-strategy=native
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# =========================================================
# FR-10 FIX: File & Request Size Limits (For Attachments/Base64/AI)
# =========================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.max-http-header-size=2MB

# =========================================================
# Database Setup (Supabase PostgreSQL on Render, H2 Locally)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/boarddb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.h2.console.enabled=true

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =========================================================
# JWT Configuration
# =========================================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# =========================================================
# Standard Spring Security Google OAuth2 Configuration
# =========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:14221300375-golql1q5fkq7ulphj2v34kdf6skfk2r9.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# Custom Google Client ID
google.client.id=${GOOGLE_CLIENT_ID:14221300375-golql1q5fkq7ulphj2v34kdf6skfk2r9.apps.googleusercontent.com}

# =========================================================
# JavaMailSender / SMTP Configuration (Real Email OTP)
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:imshan314@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# =========================================================
# Fast Groq AI Configuration (Ultra-Fast Task Analyzer)
# =========================================================
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
spring.application.name=demo

# =========================================================
# FR-10 FIX: File & Request Size Limits (For Attachments/Base64)
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.max-http-header-size=2MB

# =========================================================
# H2 File-based Permanent Database Setup (FIXED URL)
# =========================================================
spring.datasource.url=jdbc:h2:file:./data/boarddb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Hibernate DDL Auto (fresh column generate karne ke liye update rakhein)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

